<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <title>SentinelOps | Centro de Operaciones</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0a0e1a;
      --bg-2: #0d1220;
      --surface: #131829;
      --surface-hover: #1a2035;
      --border: #1e293b;
      --border-light: #2a3651;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --critical: #dc2626;
      --info: #06b6d4;
      --purple: #8b5cf6;
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.4);
      --sidebar-w: 240px;
      --topbar-h: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
      overflow: hidden;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }

    /* ===== LAYOUT ===== */
    .app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
    }

    /* Backdrop (solo mobile) */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 199;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      backdrop-filter: blur(2px);
    }
    .sidebar-backdrop.active { opacity: 1; visibility: visible; }

    .brand { display: flex; align-items: center; gap: 12px; padding: 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .brand-icon { font-size: 28px; flex-shrink: 0; }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
    .brand-sub { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    .nav { flex: 1; padding: 12px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s ease;
      text-align: left;
      width: 100%;
      min-height: 44px;
      white-space: nowrap;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item .nav-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .nav-badge {
      margin-left: auto;
      background: var(--danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      min-width: 20px;
      text-align: center;
      transition: transform 0.3s;
    }
    .nav-badge.pulse { animation: badgePulse 0.6s ease 3; }
    @keyframes badgePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.4); background: #ff3b30; box-shadow: 0 0 20px rgba(255,59,48,0.8); }
    }
    .nav-item.active .nav-badge { background: rgba(255,255,255,0.25); }

    .sidebar-footer { padding: 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .user-block { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--purple));
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: white;
      flex-shrink: 0;
    }
    .user-name { font-size: 13px; font-weight: 600; }
    .user-role { font-size: 11px; color: var(--text-muted); }

    /* ===== MAIN ===== */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }

    .topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .hamburger {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 20px;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .hamburger:hover { background: var(--surface-hover); }
    .topbar h1 { font-size: 18px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }

    .sim-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .sim-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: translateX(-100%);
      animation: shimmer 3s infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      50%, 100% { transform: translateX(100%); }
    }
    .sim-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(220,38,38,0.4); }
    .sim-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .sim-btn:disabled::before { display: none; }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .live-badge .dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; animation: pulse 1.5s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

    #clock {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      -webkit-overflow-scrolling: touch;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* ===== CARDS ===== */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card-header h3 { font-size: 14px; font-weight: 600; }
    .card-body { padding: 18px; }

    /* ===== KPIs ===== */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .kpi {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
    }
    .kpi.flash { animation: kpiFlash 1.5s ease; }
    @keyframes kpiFlash {
      0%, 100% { border-color: var(--border); }
      20% { border-color: var(--danger); box-shadow: 0 0 30px rgba(220,38,38,0.4); }
    }
    .kpi::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 3px; height: 100%;
      background: var(--primary);
    }
    .kpi.success::before { background: var(--success); }
    .kpi.warning::before { background: var(--warning); }
    .kpi.danger::before { background: var(--danger); }
    .kpi.info::before { background: var(--info); }
    .kpi.purple::before { background: var(--purple); }
    .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 6px; }
    .kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
    .kpi-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
    .kpi-trend { font-size: 11px; font-weight: 600; margin-top: 6px; }
    .kpi-trend.up { color: var(--success); }
    .kpi-trend.down { color: var(--danger); }

    .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
    .chart-container { position: relative; height: 260px; }
    .chart-full { grid-column: 1 / -1; }

    /* ===== TABLES ===== */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: var(--bg-2); }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.15s; }
    tbody tr:hover { background: var(--surface-hover); cursor: pointer; }
    tr.new-row { animation: rowHighlight 2s ease; }
    @keyframes rowHighlight {
      0% { background: rgba(220,38,38,0.3); }
      100% { background: transparent; }
    }

    /* ===== BADGES ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .badge-critical { background: rgba(220, 38, 38, 0.15); color: #fca5a5; }
    .badge-high     { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .badge-medium   { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .badge-low      { background: rgba(100, 116, 139, 0.2); color: #94a3b8; }
    .badge-success  { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .badge-danger   { background: rgba(220, 38, 38, 0.15); color: #fca5a5; }
    .badge-warning  { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .badge-info     { background: rgba(6, 182, 212, 0.15); color: #22d3ee; }

    /* ===== STATUS ===== */
    .status-dot { display: inline-flex; align-items: center; gap: 8px; }
    .status-dot::before {
      content: '';
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }
    .status-dot.degraded::before { background: var(--warning); box-shadow: 0 0 8px var(--warning); }
    .status-dot.down::before { background: var(--danger); box-shadow: 0 0 8px var(--danger); animation: pulse 1.5s infinite; }

    /* ===== SERVICES GRID ===== */
    .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
    .service-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .service-card:hover { border-color: var(--border-light); transform: translateY(-2px); box-shadow: var(--shadow); }
    .service-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .service-name { font-size: 14px; font-weight: 600; }
    .service-region { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .service-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; border-top: 1px solid var(--border); }
    .service-metric-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .service-metric-value { font-size: 15px; font-weight: 700; margin-top: 2px; }

    /* ===== FILTERS ===== */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filter-btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      transition: all 0.15s;
      min-height: 36px;
    }
    .filter-btn:hover { border-color: var(--border-light); color: var(--text); }
    .filter-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; animation: fadeIn 0.15s ease; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-header { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-shrink: 0; }
    .modal-title { font-size: 16px; font-weight: 600; }
    .modal-close {
      font-size: 22px;
      color: var(--text-muted);
      width: 36px; height: 36px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .modal-close:hover { background: var(--surface-hover); color: var(--text); }
    .modal-body { padding: 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }
    .modal-footer { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }

    /* ===== ESCENARIOS ===== */
    .scenarios-list { display: grid; gap: 10px; }
    .scenario {
      display: flex;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-2);
      transition: all 0.15s;
      text-align: left;
      width: 100%;
      cursor: pointer;
    }
    .scenario:hover { border-color: var(--danger); background: rgba(220,38,38,0.05); }
    .scenario:active { transform: scale(0.99); }
    .scenario-icon { font-size: 26px; flex-shrink: 0; width: 36px; text-align: center; }
    .scenario-body { flex: 1; min-width: 0; }
    .scenario-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .scenario-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }
    .scenario-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ===== LIVE PANEL ===== */
    .live-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 400px;
      max-width: calc(100vw - 48px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      z-index: 3000;
      transform: translateX(calc(100% + 40px));
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }
    .live-panel.open { transform: translateX(0); }
    .live-panel-header {
      padding: 14px 18px;
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.18), rgba(220, 38, 38, 0.06));
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex-shrink: 0;
    }
    .live-panel-pulse {
      width: 12px; height: 12px;
      background: var(--danger);
      border-radius: 50%;
      animation: pulse 1s infinite;
      box-shadow: 0 0 15px var(--danger);
      flex-shrink: 0;
      margin-top: 4px;
    }
    .live-panel-title { font-size: 11px; font-weight: 700; color: var(--danger); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .live-panel-incident-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .live-panel-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
    .live-panel-body { padding: 14px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }
    .live-progress { height: 4px; background: var(--bg-2); border-radius: 2px; overflow: hidden; margin-bottom: 14px; flex-shrink: 0; }
    .live-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--danger), var(--warning), var(--success));
      width: 0%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 2px;
    }

    .live-step {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      opacity: 0.4;
      transition: opacity 0.3s;
    }
    .live-step.active { opacity: 1; }
    .live-step.done { opacity: 1; }
    .step-icon {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--bg-2);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.3s;
    }
    .live-step.active .step-icon {
      border-color: var(--warning);
      background: rgba(245,158,11,0.15);
      animation: spinBorder 1.2s linear infinite;
    }
    @keyframes spinBorder {
      0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(245,158,11,0); }
      100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
    }
    .live-step.done .step-icon {
      border-color: var(--success);
      background: rgba(16,185,129,0.15);
      color: var(--success);
    }
    .step-content { flex: 1; min-width: 0; }
    .step-label { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .step-meta { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
    .live-step.active .step-meta { color: var(--warning); }
    .live-step.done .step-meta { color: var(--success); }

    /* ===== TIMELINE ===== */
    .timeline { position: relative; padding-left: 24px; margin: 16px 0; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
    .timeline-item { position: relative; padding-bottom: 16px; }
    .timeline-item::before { content: ''; position: absolute; left: -22px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface); }
    .timeline-time { font-size: 11px; color: var(--text-dim); }
    .timeline-text { font-size: 13px; margin-top: 2px; line-height: 1.4; }

    /* ===== RUNBOOK ===== */
    .runbook { margin-top: 16px; }
    .runbook-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; font-size: 13px; cursor: pointer; }
    .runbook-item input[type="checkbox"] { margin-top: 2px; width: 18px; height: 18px; accent-color: var(--success); cursor: pointer; flex-shrink: 0; }
    .runbook-item.done span { text-decoration: line-through; color: var(--text-dim); }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      top: 20px; right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 4000;
      pointer-events: none;
      max-width: calc(100vw - 40px);
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--primary);
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      box-shadow: var(--shadow);
      animation: slideIn 0.25s ease;
      min-width: 240px;
      max-width: 380px;
      pointer-events: auto;
      line-height: 1.4;
    }
    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ===== MISC ===== */

    .grid-detail dd { font-weight: 600; word-break: break-word; }
    .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-icon { font-size: 48px; margin-bottom: 8px; opacity: 0.5; }
    .ml-auto { margin-left: auto; }
    code { background: var(--bg-2); padding: 2px 6px; border-radius: 4px; font-size: 11px; color: var(--info); word-break: break-all; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 16px; font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); transition: all 0.15s; min-height: 40px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { filter: brightness(0.9); }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--surface-hover); }
    .btn-sm { padding: 6px 10px; font-size: 12px; min-height: 34px; }

    /* ===== RESPONSIVE ===== */

    /* Tablet — sidebar colapsado a íconos */
    @media (max-width: 1024px) {
      :root { --sidebar-w: 68px; }
      .brand { padding: 16px 8px; justify-content: center; }
      .brand-name, .brand-sub { display: none; }

      .nav-item { justify-content: center; padding: 12px 8px; gap: 0; }
      .nav-item .nav-label { display: none; }

        position: absolute;

        min-width: 16px;
        padding: 1px 4px;
        font-size: 9px;
      }
      .nav-item { position: relative; }
      .sidebar-footer { padding: 10px 8px; }
      .user-block { justify-content: center; }
      .user-info { display: none; }
    }

    /* Mobile — sidebar como drawer + topbar 2 líneas */
    @media (max-width: 768px) {
      :root { --sidebar-w: 260px; --topbar-h: auto; }

      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;

        height: 100dvh;

      .user-block { justify-content: flex-start; }

      .topbar {
        padding: 10px 12px;

        gap: 8px;
        flex-wrap: nowrap;
      }
      .topbar h1 { font-size: 16px; }
      .topbar-right { gap: 6px; }
      #clock { display: none; }
      .live-badge { padding: 3px 8px; font-size: 10px; letter-spacing: 0.3px; }
      .live-badge .dot { width: 6px; height: 6px; }
      .sim-btn { padding: 8px 12px; font-size: 12px; gap: 4px; }
      .sim-btn .sim-label { display: none; }
      .sim-btn .sim-icon { font-size: 16px; }

      .content { padding: 12px; }

      /* KPIs 2 columnas */
      .kpis { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
      .kpi { padding: 12px; }
      .kpi-value { font-size: 22px; }
      .kpi-label { font-size: 10px; margin-bottom: 4px; }
      .kpi-sub { font-size: 11px; }
      .kpi-trend { font-size: 10px; }

      /* Charts 1 columna */
      .charts-grid { grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
      .chart-container { height: 220px; }
      .chart-full .chart-container { height: 240px; }
      .grid-2 { grid-template-columns: 1fr; gap: 12px; }

      /* Cards */
      .card-header { padding: 12px 14px; }
      .card-body { padding: 14px; }
      .card-header h3 { font-size: 13px; }

      /* Tablas — scroll horizontal suave */
      .table-wrap { margin: 0 -14px; padding: 0 14px; }
      th { padding: 8px 12px; font-size: 10px; }
      td { padding: 10px 12px; font-size: 12px; }

      /* Modales full-screen bottom-sheet */
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal {
        max-width: 100%;
        max-height: 92vh;
        max-height: 92dvh;
        border-radius: var(--radius) var(--radius) 0 0;
        transform: translateY(100%);
      }
      .modal-overlay.open .modal { transform: translateY(0); }
      .modal-body { padding: 16px; }
      .modal-footer { padding: 12px 16px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .modal-footer .btn { flex: 1; }
      .grid-detail { grid-template-columns: 110px 1fr; font-size: 12px; }

      /* Live panel bottom-sheet full-width */
      .live-panel {
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        max-width: 100%;
        max-height: 78vh;
        max-height: 78dvh;
        border-radius: var(--radius) var(--radius) 0 0;
        transform: translateY(100%);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .live-panel.open { transform: translateY(0); }

      /* Toasts full-width desde arriba */
      .toast-container { top: 12px; left: 12px; right: 12px; max-width: none; }
      .toast { min-width: 0; max-width: none; width: 100%; font-size: 12px; padding: 10px 14px; }

      /* Botones */
      .btn { min-height: 44px; }
      .filter-btn { min-height: 38px; padding: 8px 14px; }

      /* Evitar zoom en iOS */
      input, select, textarea { font-size: 16px !important; }

      /* Touch feedback */
      .nav-item:active { background: var(--surface-hover); }
      tbody tr:active { background: var(--surface-hover); }
    }

    /* Small phone (≤480px) */
    @media (max-width: 480px) {
      .kpis { grid-template-columns: 1fr; }
      .kpi-value { font-size: 24px; }

    @supports (padding: max(0px)) {
      .topbar { padding-top: max(10px, env(safe-area-inset-top)); }
      .sidebar { padding-top: env(safe-area-inset-top); }
      .toast-container { top: max(20px, env(safe-area-inset-top)); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function timeAgo(ts) {
    const d = Math.floor((Date.now() - ts) / 1000);
    if (d < 60) return 'hace ' + d + 's';
    if (d < 3600) return 'hace ' + Math.floor(d / 60) + ' min';
    if (d < 86400) return 'hace ' + Math.floor(d / 3600) + 'h';

  // ==================== MODALES ====================
  function openModal(html) {
    const o = document.getElementById('modal-overlay');
    o.innerHTML = html;
    o.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  function showAlertDetail(id) {
    const a = DATA.alerts.find(x => x.id === id);
    if (!a) return;
    const actions = [];
    if (a.status === 'active') {
      actions.push(`<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`);
      actions.push(`<button class="btn" style="background:var(--warning);color:#000;" onclick="acknowledgeAlert('${esc(a.id)}')">Reconocer</button>`);
      actions.push(`<button class="btn btn-success" onclick="resolveAlert('${esc(a.id)}')">Resolver</button>`);
    } else if (a.status === 'acknowledged') {
      actions.push(`<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`);
      actions.push(`<button class="btn btn-success" onclick="resolveAlert('${esc(a.id)}')">Marcar resuelta</button>`);
    } else {
      actions.push(`<button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>`);
    }

    openModal(`
      <div class="modal">
        <div class="modal-header">
          <div style="min-width:0;">
            <div style="display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap;">
              ${severityBadge(a.severity)} ${statusBadge(a.status)}
            </div>
            <div class="modal-title">${esc(a.title)}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">
              <code>${esc(a.id)}</code> · ${esc(a.service)} · ${timeAgo(a.createdAt)}
            </div>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <dl class="grid-detail">
            <dt>Mensaje</dt><dd>${esc(a.message)}</dd>
            <dt>Servicio</dt><dd>${esc(a.service)}</dd>
            <dt>Zona</dt><dd><code>${esc(a.zone || '—')}</code></dd>
            <dt>Creada</dt><dd>${new Date(a.createdAt).toLocaleString('es-CO')}</dd>
            ${a.ackedBy ? `<dt>Reconocida</dt><dd>${esc(a.ackedBy)} (${timeAgo(a.ackedAt)})</dd>` : ''}
            ${a.resolvedAt ? `<dt>Resuelta</dt><dd>${new Date(a.resolvedAt).toLocaleString('es-CO')}</dd>` : ''}
          </dl>
        </div>
        <div class="modal-footer">${actions.join('')}</div>
      </div>
    `);
  }

  function showIncidentDetail(id) {
    const inc = DATA.incidents.find(x => x.id === id);
    if (!inc) return;
    const total = inc.runbook.length;
    const done = inc.runbook.filter(r => r.done).length;
    const pct = Math.round((done / total) * 100);

    openModal(`
      <div class="modal">
        <div class="modal-header">
          <div style="min-width:0;">
            <div style="display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap;">
              ${severityBadge(inc.severity)}
              ${inc.status === 'open' ? '<span class="badge badge-danger">Abierto</span>' : inc.status === 'investigating' ? '<span class="badge badge-warning">Investigando</span>' : inc.status === 'mitigated' ? '<span class="badge badge-info">Mitigado</span>' : '<span class="badge badge-success">Resuelto</span>'}
            </div>
            <div class="modal-title">${esc(inc.title)}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">
              <code>${esc(inc.id)}</code> · ${esc(inc.service)} · <code>${esc(inc.zone || '—')}</code>
            </div>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <p style="color:var(--text-muted); margin-bottom:16px; line-height:1.5;">${esc(inc.description)}</p>
          <dl class="grid-detail">
            <dt>Asignado</dt><dd>${esc(inc.assignedTo)}</dd>
            <dt>Zona</dt><dd><code>${esc(inc.zone || '—')}</code></dd>
            <dt>Impacto</dt><dd>${esc(inc.impact)}</dd>
            <dt>Creado</dt><dd>${new Date(inc.createdAt).toLocaleString('es-CO')}</dd>
            ${inc.resolvedAt ? `<dt>Resuelto</dt><dd>${new Date(inc.resolvedAt).toLocaleString('es-CO')}</dd>` : ''}
          </dl>

          <h4 style="margin-top:20px; margin-bottom:8px; font-size:12px; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.5px;">Runbook · ${done}/${total} (${pct}%)</h4>
          <div class="runbook">
            ${inc.runbook.map((r, idx) => `
              <label class="runbook-item ${r.done ? 'done' : ''}">
                <input type="checkbox" ${r.done ? 'checked' : ''} data-runbook-idx="${idx}" />
                <span>${esc(r.text)}</span>
              </label>
            `).join('')}
          </div>

          <h4 style="margin-top:20px; margin-bottom:8px; font-size:12px; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.5px;">Timeline</h4>
          <div class="timeline">
            ${inc.timeline.map(t => `
              <div class="timeline-item">
                <div class="timeline-time">${fmtTime(t.time)}</div>
                <div class="timeline-text">${esc(t.text)}</div>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closeModal()">Cerrar</button>
          ${inc.status !== 'resolved' ? `<button class="btn btn-primary" onclick="resolveIncident('${esc(inc.id)}')">Resolver</button>` : ''}
        </div>
      </div>
    `);

    document.querySelectorAll('[data-runbook-idx]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const idx = Number(e.target.dataset.runbookIdx);
        inc.runbook[idx].done = e.target.checked;
        e.target.parentElement.classList.toggle('done', e.target.checked);
        const nd = inc.runbook.filter(r => r.done).length;
        const np = Math.round((nd / total) * 100);
        const h4 = document.querySelector('.runbook').previousElementSibling;
        if (h4) h4.textContent = `Runbook · ${nd}/${total} (${np}%)`;
        toast('Progreso: ' + nd + '/' + total, 'success');
      });
    });
  }

  function showServiceDetail(id) {
    const s = DATA.services.find(x => x.id === id);
    if (!s) return;
    const a = DATA.alerts.filter(x => x.service === s.name && x.status !== 'resolved');

    openModal(`
      <div class="modal">
        <div class="modal-header">
          <div>
            <div style="display:flex; gap:6px; align-items:center; margin-bottom:6px;">${serviceStatusDot(s.status)}</div>
            <div class="modal-title">${esc(s.name)}</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${esc(s.region)} · <code>${esc(s.id)}</code></div>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <dl class="grid-detail">
            <dt>Uptime</dt><dd>${s.uptime}%</dd>
            <dt>p95</dt><dd>${s.p95}ms</dd>
            <dt>Req/s</dt><dd>${s.requests.toLocaleString()}</dd>
            <dt>Alertas</dt><dd>${a.length}</dd>
          </dl>
          ${a.length > 0 ? `
            <h4 style="margin-top:20px; margin-bottom:8px; font-size:12px; text-transform:uppercase; color:var(--text-muted); letter-spacing:0.5px;">Alertas activas</h4>
            ${a.map(x => `
              <div style="padding:10px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px;">
                <div style="display:flex; gap:8px; margin-bottom:4px; flex-wrap:wrap;">${severityBadge(x.severity)}<strong style="font-size:13px;">${esc(x.title)}</strong></div>
                <div style="font-size:12px; color:var(--text-muted); line-height:1.4;">${esc(x.message)}</div>
              </div>
            `).join('')}
          ` : '<p style="color:var(--text-muted); margin-top:16px;">✓ Sin alertas activas</p>'}
        </div>
        <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button></div>
      </div>
    `);
  }

  // ==================== ACCIONES ====================
  function acknowledgeAlert(id) {
    const a = DATA.alerts.find(x => x.id === id);
    if (!a) return;
    a.status = 'acknowledged'; a.ackedBy = 'María Rodríguez'; a.ackedAt = Date.now();
    toast('Alerta ' + a.id + ' reconocida', 'success');
    closeModal(); renderCurrentPage(); updateAlertCount();
  }
  function resolveAlert(id) {
    const a = DATA.alerts.find(x => x.id === id);
    if (!a) return;
    a.status = 'resolved'; a.resolvedAt = Date.now();
    toast('Alerta ' + a.id + ' resuelta', 'success');
    closeModal(); renderCurrentPage(); updateAlertCount();
  }
  function resolveIncident(id) {
    const inc = DATA.incidents.find(x => x.id === id);
    if (!inc) return;
    inc.status = 'resolved'; inc.resolvedAt = Date.now();
    inc.timeline.push({ time: Date.now(), text: 'Incidente resuelto manualmente' });
    toast('Incidente ' + inc.id + ' resuelto', 'success');
    closeModal(); renderCurrentPage();
  }

  // ==================== NAVEGACIÓN ====================
  function navigate(page) {
    STATE.page = page;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + page));
    const titles = { dashboard: 'Dashboard', servicios: 'Servicios', alertas: 'Alertas', incidentes: 'Incidentes', equipo: 'Equipo' };
    document.getElementById('page-title').textContent = titles[page] || 'SentinelOps';
    renderCurrentPage();
    closeSidebar();
    document.getElementById('content').scrollTop = 0;
  }

  function renderCurrentPage() {
    const map = { dashboard: renderDashboard, servicios: renderServicios, alertas: renderAlertas, incidentes: renderIncidentes, equipo: renderEquipo };
    if (map[STATE.page]) map[STATE.page]();
  }

  function updateAlertCount() {
    const b = document.getElementById('nav-alert-count');
    if (b) { b.textContent = getActiveAlertCount(); b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
  }

  // ==================== SIMULADOR ====================
  function openSimulatorMenu() {
    if (STATE.simulating) { toast('Ya hay un simulacro en curso', 'warning'); return; }
    openModal(`
      <div class="modal">
        <div class="modal-header">
          <div>
            <div class="modal-title">⚡ Simular incidencia</div>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">Elige un escenario para ver el flujo en tiempo real.</div>
          </div>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="scenarios-list">
            ${SCENARIOS.map((s, i) => `
              <button class="scenario" onclick="startSimulation(${i})">
                <div class="scenario-icon">${s.icon}</div>
                <div class="scenario-body">
                  <div class="scenario-name">${esc(s.name)}</div>
                  <div class="scenario-desc">${esc(s.desc)}</div>
                  <div class="scenario-meta">
                    ${severityBadge(s.severity)}
                    <span class="badge badge-info">📍 ${esc(s.zone)}</span>
                  </div>
                </div>
              </button>
            `).join('')}
          </div>
        </div>
        <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button></div>
      </div>
    `);
  }

  function showLivePanel(scenario) {
    document.getElementById('lp-name').textContent = scenario.title;
    document.getElementById('lp-meta').innerHTML = `
      ${severityBadge(scenario.severity)}
      <span class="badge badge-info">📍 ${esc(scenario.zone)}</span>
      <span style="font-size:11px; color:var(--text-muted);">${esc(scenario.service)}</span>
    `;
    document.getElementById('lp-progress').style.width = '0%';
    document.getElementById('lp-steps').innerHTML = `
      <div class="live-step" data-step="detection"><div class="step-icon">1</div><div class="step-content"><div class="step-label">Detección</div><div class="step-meta">Alertmanager · esperando</div></div></div>
      <div class="live-step" data-step="correlation"><div class="step-icon">2</div><div class="step-content"><div class="step-label">Correlación</div><div class="step-meta">Creando incidente...</div></div></div>
      <div class="live-step" data-step="assignment"><div class="step-icon">3</div><div class="step-content"><div class="step-label">Asignación</div><div class="step-meta">Buscando on-call...</div></div></div>
      <div class="live-step" data-step="notification"><div class="step-icon">4</div><div class="step-content"><div class="step-label">Notificación</div><div class="step-meta">Notificando canales...</div></div></div>
      <div class="live-step" data-step="acknowledgement"><div class="step-icon">5</div><div class="step-content"><div class="step-label">Reconocimiento</div><div class="step-meta">Esperando confirmación...</div></div></div>
    `;
    document.getElementById('live-panel').classList.add('open');
  }

  function updateLiveStep(name, status, meta) {
    const el = document.querySelector(`[data-step="${name}"]`);
    if (!el) return;
    el.classList.remove('active', 'done');
    if (status === 'active') el.classList.add('active');
    if (status === 'done') { el.classList.add('done'); el.querySelector('.step-icon').textContent = '✓'; }
    if (meta) el.querySelector('.step-meta').textContent = meta;
    const done = document.querySelectorAll('.live-step.done').length;
    document.getElementById('lp-progress').style.width = Math.round((done / 5) * 100) + '%';
  }

  function closeLivePanel() { document.getElementById('live-panel').classList.remove('open'); }

  async function startSimulation(idx) {
    const sc = SCENARIOS[idx];
    if (!sc || STATE.simulating) return;
    STATE.simulating = true;
    closeModal();

    const btn = document.getElementById('sim-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="sim-icon">⏳</span><span class="sim-label">Simulando...</span>';

    showLivePanel(sc);
    await sleep(400);

    updateLiveStep('detection', 'active', 'Alertmanager evaluando regla...');
    await sleep(1200);
    updateLiveStep('detection', 'done', 'Alertmanager · disparada');

    toast(`🚨 ALERTA ${sc.severity.toUpperCase()}: ${sc.title}`, 'error', 5000);

    const newAlert = {
      id: 'ALR-' + (4900 + Math.floor(Math.random() * 100)),
      severity: sc.severity, service: sc.service, zone: sc.zone,
      title: sc.title, message: sc.message, status: 'active',
      createdAt: Date.now(), _justCreated: true
    };
    DATA.alerts.unshift(newAlert);
    updateAlertCount();
    renderCurrentPage();

    const kpi = document.getElementById('kpi-alertas');
    if (kpi) { kpi.classList.add('flash'); setTimeout(() => kpi.classList.remove('flash'), 1500); }

    updateLiveStep('correlation', 'active', 'Agrupando alertas...');
    await sleep(1500);
    updateLiveStep('correlation', 'done', 'Incidente creado');

    const incId = 'INC-' + STATE.simCounter++;
    const newInc = {
      id: incId, title: sc.title, description: sc.message,
      severity: sc.severity, status: 'investigating',
      service: sc.service, zone: sc.zone,
      assignedTo: sc.assignedTo, createdAt: Date.now(), impact: sc.impact,
      runbook: sc.runbook.map(t => ({ text: t, done: false })),
      timeline: [
        { time: Date.now(), text: `Alerta ${newAlert.id} disparada` },
        { time: Date.now() + 200, text: 'Incidente creado automáticamente' }
      ],
      _justCreated: true
    };
    DATA.incidents.unshift(newInc);
    renderCurrentPage();

    updateLiveStep('assignment', 'active', 'Consultando rotación...');
    await sleep(1500);
    updateLiveStep('assignment', 'done', `${sc.assignedTo} (${sc.assignRole})`);

    updateLiveStep('notification', 'active', `Enviando a ${sc.notify.length} canales...`);
    await sleep(1800);
    updateLiveStep('notification', 'done', `✓ ${sc.notify.join(', ')}`);

    updateLiveStep('acknowledgement', 'active', `Esperando ACK...`);
    await sleep(1800);
    updateLiveStep('acknowledgement', 'done', `${sc.assignedTo} reconoció`);

    newAlert.status = 'acknowledged';
    newAlert.ackedBy = sc.assignedTo;
    newAlert.ackedAt = Date.now();

    newInc.timeline.push(
      { time: Date.now() - 3500, text: `${sc.assignedTo} asignado como incident commander` },
      { time: Date.now() - 2000, text: `Notificado a ${sc.notify.join(', ')}` },
      { time: Date.now(), text: `${sc.assignedTo} reconoció el incidente.` }
    );

    toast(`✓ ${incId} gestionado — ${sc.assignedTo} investigando`, 'success', 4000);

    await sleep(1200);
    closeLivePanel();
    STATE.simulating = false;
    btn.disabled = false;
    btn.innerHTML = '<span class="sim-icon">⚡</span><span class="sim-label">Simular Incidencia</span>';

    renderCurrentPage();
    await sleep(300);
    showIncidentDetail(incId);
  }

  // ==================== LIVE MODE ====================
  function startLiveMode() {
    setInterval(() => {
      if (STATE.simulating) return;
      DATA.services.forEach(s => {
        if (s.status === 'operational' && s.p95 > 0) s.p95 = Math.max(10, s.p95 + Math.floor((Math.random() - 0.5) * 10));
        if (s.requests > 0) s.requests = Math.max(0, s.requests + Math.floor((Math.random() - 0.5) * 50));
      });
      if (STATE.page === 'dashboard' || STATE.page === 'servicios') renderCurrentPage();
    }, 5000);
  }

  function startClock() {
    const el = document.getElementById('clock');
    const t = () => { el.textContent = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); };
    t(); setInterval(t, 1000);
  }

  // ==================== INIT ====================
  function init() {
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => navigate(item.dataset.page));
    });
    document.getElementById('sim-btn').addEventListener('click', openSimulatorMenu);
    document.getElementById('hamburger').addEventListener('click', openSidebar);
    document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); closeSidebar(); }
    });

    updateAlertCount();
    renderDashboard();
    startClock();
    startLiveMode();
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
